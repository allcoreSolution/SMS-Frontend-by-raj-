<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School ERP Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet Interactive Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <script type="text/javascript">
      (function() {
        try {
          var isHindiSession = sessionStorage.getItem('app_user_selected_hindi') === 'true';
          if (!isHindiSession) {
            var host = window.location.hostname;
            var domains = ['', host, '.' + host];
            var paths = ['/', window.location.pathname];
            domains.forEach(function(d) {
              paths.forEach(function(p) {
                document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=' + p + (d ? '; domain=' + d : '') + ';';
              });
            });
            localStorage.setItem('app_language', 'English');
            localStorage.setItem('app_language_code', 'en');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none !important;visibility:hidden !important;position:absolute !important;top:-9999px !important;left:-9999px !important;width:0 !important;height:0 !important;overflow:hidden !important;pointer-events:none !important;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate && window.google.translate.TranslateElement) {
          try {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              autoDisplay: false,
              includedLanguages: 'en,hi',
              layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
          } catch (e) {
            console.warn('Google translate init error:', e);
          }
        }
      }
    </script>
    <script async defer type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
