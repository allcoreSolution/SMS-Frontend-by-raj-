<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin Platform | ALL CORE SOLUTION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Complete Visual Suppression for Google Translate (Hide top banner, tooltip, and extra spaces) -->
    <style>
      body > .skiptranslate,
      div.skiptranslate,
      iframe.skiptranslate,
      .goog-te-banner-frame,
      iframe.goog-te-banner-frame,
      .goog-te-balloon-frame,
      #goog-gt-tt,
      #goog-gt-vt,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-text-highlight,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-yAW6fm-L9AdLc,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMy,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMy-ti6hGc,
      .VIpgJd-ZVi9od-aZ2wjd-Ond6De,
      .VIpgJd-yAWNEb-L7lbkb,
      .VIpgJd-yAWNEb-hvh4ld,
      .VIpgJd-ZVi9od-ORHb,
      .VIpgJd-ZVi9od-SmMuJa,
      .VIpgJd-ZVi9od-xl07Ob-OEVmcd,
      .VIpgJd-yAWNEb-r4nke,
      [class*="VIpgJd"],
      [id*="goog-gt-"],
      .goog-logo-link,
      .goog-te-gadget,
      .goog-te-gadget-icon,
      .goog-te-gadget-simple,
      .goog-te-spinner-pos {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        z-index: -99999 !important;
      }

      #google_translate_element {
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        opacity: 0.01 !important;
        pointer-events: none !important;
        z-index: -99999 !important;
        overflow: hidden !important;
      }

      body {
        top: 0px !important;
        position: static !important;
      }

      font, font:hover, .goog-text-highlight {
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
        color: inherit !important;
        border: none !important;
        text-decoration: none !important;
        outline: none !important;
      }
    </style>

    <script type="text/javascript">
      // Suppress Google Translate mouseover tooltip
      window.addEventListener('mouseover', function(e) {
        if (e.target && (e.target.tagName === 'FONT' || (e.target.closest && e.target.closest('font')))) {
          e.stopPropagation();
        }
      }, true);
    </script>

    <!-- Session Language State Sync -->
    <script type="text/javascript">
      (function() {
        try {
          var isHindiSession = sessionStorage.getItem('sa_user_selected_hindi') === 'true' || localStorage.getItem('sa_language') === 'Hindi';
          var host = window.location.hostname;
          if (isHindiSession) {
            document.cookie = 'googtrans=/en/hi; path=/;';
            if (host) document.cookie = 'googtrans=/en/hi; path=/; domain=' + host + ';';
          } else {
            var domains = ['', host, '.' + host];
            var paths = ['/', window.location.pathname];
            domains.forEach(function(d) {
              paths.forEach(function(p) {
                document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=' + p + (d ? '; domain=' + d : '') + ';';
              });
            });
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            localStorage.setItem('sa_language', 'English');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Google Translate Element Container (rendered off-screen, NOT display:none) -->
    <div id="google_translate_element"></div>
    
    <!-- Google Translate Initialization Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate && window.google.translate.TranslateElement) {
          try {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              autoDisplay: false,
              includedLanguages: 'en,hi'
            }, 'google_translate_element');
          } catch (e) {
            console.warn('Google translate init error:', e);
          }
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
